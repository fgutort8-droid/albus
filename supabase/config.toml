project_id = "ssvehwhblgqtvqkfbkbj"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[auth]
enabled = true
site_url = "albus://auth-callback"
additional_redirect_urls = ["albus://auth-callback"]

# Sessions: short access tokens, rotating refresh tokens with reuse detection.
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

# No account on first launch — every user starts anonymous.
enable_anonymous_sign_ins = true

# Manual linking lets an anonymous user become permanent at purchase
# WITHOUT losing their row, so nothing has to be migrated.
enable_manual_linking = true

# Email/password is not used. Apple Sign-In is added at the paywall.
[auth.email]
enable_signup = false
enable_confirmations = false

[auth.external.apple]
enabled = false   # flip on when the Apple Developer account is configured

# CAPTCHA cannot be switched on unilaterally: once enabled, Supabase rejects any
# sign-up that does not carry a captcha token.
#
# The client half is done — `CaptchaService` presents a Cloudflare Turnstile
# challenge and `SessionService.createAccount` passes the token through. It is
# inert until `TURNSTILE_SITE_KEY` is set in Config.xcconfig: `Captcha.isEnabled`
# is `!siteKey.isEmpty`, so with no key onboarding skips the challenge entirely.
#
# `provider` said "hcaptcha" while the client implements Turnstile. That is not a
# problem while this is off, and would have been one the moment it was flipped on:
# Supabase would have tried to verify a Turnstile token against hCaptcha and
# rejected every single sign-up. Corrected to match what the client actually sends.
#
# To switch on, all three are needed together:
#   1. TURNSTILE_SITE_KEY in ios/App/Config.xcconfig  (public, safe on device)
#   2. the Turnstile SECRET key in the Supabase dashboard, Auth > Settings
#      (never in this repo — it verifies tokens server-side)
#   3. enabled = true here
[auth.captcha]
enabled = false
provider = "turnstile"

# Until then, this is the real control on account-farming. The default is 30
# anonymous sign-ins per hour per IP; a genuine student needs exactly one, and
# a shared school NAT might need a handful. Ten leaves room for that while
# cutting the ceiling on scripted signups by two thirds.
[auth.rate_limit]
anonymous_users = 10
sign_in_sign_ups = 30
token_refresh = 150

[edge_runtime]
enabled = true
policy = "per_worker"

# Explicit deployment policy. Student endpoints are checked by the Supabase
# gateway and then verify the user again in requireUser(). RevenueCat cannot
# present a user JWT; it authenticates with an Authorization secret plus an
# HMAC signature over the exact raw body.
[functions.breakdown]
verify_jwt = true

[functions.grade]
verify_jwt = true

[functions.delete-account]
verify_jwt = true

[functions.revenuecat-webhook]
verify_jwt = false
