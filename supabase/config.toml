project_id = "ssvehwhblgqtvqkfbkbj"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[auth]
enabled = true
site_url = "albus://auth-callback"
additional_redirect_urls = ["albus://auth-callback"]

# Sessions: short access tokens, rotating refresh tokens with reuse detection.
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

# This file runs the local stack; production is changed separately in the
# dashboard. Follow docs/security/sign-in-runbook.md to keep both in step.
# The new app signs in with Apple before creating an account. Production turns
# anonymous signup OFF after testers update: existing anonymous sessions still
# refresh. Keep it ON locally to test those accounts linking Apple in place.
enable_anonymous_sign_ins = true

# Preserve the old anonymous account's id and content when it links Apple.
enable_manual_linking = true

# CLI 2.98.2 maps this to GOTRUE_EXTERNAL_EMAIL_ENABLED=false, disabling the
# email provider, not global signup. Password signup and OTP for both new and
# existing addresses are refused; Apple remains enabled independently.
[auth.email]
enable_signup = false
enable_confirmations = false

# Native ID-token sign-in only; GoTrue verifies the bundle-id audience.
# CLI 2.98.2 explicitly permits Apple without an OAuth client secret.
[auth.external.apple]
enabled = true
client_id = "com.felipegutierrez.albus"

# The app has no CAPTCHA. Native Apple's id_token grant is exempt from its
# check. After production disables anonymous signup, no other signup path
# remains for CAPTCHA to protect. Leave it off in the dashboard too.
[auth.captcha]
enabled = false
provider = "turnstile"

# GoTrue 2.188.1 applies token_refresh (GOTRUE_RATE_LIMIT_TOKEN_REFRESH)
# to /token, including id_token; sign_in_sign_ups covers signup/email OTP.
# Local anonymous signup remains bounded separately for compatibility tests.
[auth.rate_limit]
anonymous_users = 10
sign_in_sign_ups = 30
token_refresh = 150

[edge_runtime]
enabled = true
policy = "per_worker"

# Explicit deployment policy. Student endpoints are checked by the Supabase
# gateway and then verify the user again in requireUser(). RevenueCat cannot
# present a user JWT; it authenticates with an Authorization secret plus an
# HMAC signature over the exact raw body.
[functions.breakdown]
verify_jwt = true

[functions.grade]
verify_jwt = true

[functions.delete-account]
verify_jwt = true

[functions.revenuecat-webhook]
verify_jwt = false
