name: CI

# Pull requests only.
#
# This used to also run on every push to a non-main branch, which meant a commit
# on an open PR matched *both* triggers and ran the entire suite twice — two
# macOS jobs among them, billed at ten times the Linux rate. On a private repo
# that is a metered allowance, and it went in about a day and a half. Every
# check has been red-because-unstarted since 22 Aug 2026 as a result, which is
# worse than having no CI at all: six days of meaningless red is how a real
# failure gets ignored.
#
# Push events on a branch with no PR open are not interesting anyway — nothing
# is being proposed for main yet, and `scripts/ci-local.sh` covers the loop
# before you open one.
on:
  pull_request:
    branches: [main]
  # Runs the same checks on demand, from the Actions tab or
  # `gh workflow run ci.yml --ref <branch>`, without pushing a commit.
  # The append-only migration check needs a pull request to compare
  # against, so it skips itself here.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets-scan:
    name: No secrets committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify dependency controls
        run: |
          python3 scripts/check-dependency-controls.py
          python3 scripts/test-dependency-controls.py
          python3 scripts/test-deployment-preview.py
      - name: Scan for live credentials
        run: |
          set -euo pipefail
          # Real key shapes. .env.example uses xxxx placeholders and is exempt.
          PATTERN='sb_secret_[A-Za-z0-9]{20,}|sbp_[A-Za-z0-9]{20,}|sk-ant-[A-Za-z0-9_-]{20,}|gh[pousr]_[A-Za-z0-9]{30,}|-----BEGIN (EC |RSA )?PRIVATE KEY-----|eyJ[A-Za-z0-9_-]{30,}\.[A-Za-z0-9_-]{30,}'
          if grep -rEn "$PATTERN" . \
               --exclude-dir=.git --exclude=.env.example --exclude=ci.yml; then
            echo "::error::A live credential appears to be committed. Rotate it, then remove it."
            exit 1
          fi
          echo "clean"

  rls-guard:
    name: Every table has RLS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Assert RLS on every created table
        run: |
          set -euo pipefail
          # Checked PER TABLE, not per file. The previous version asked only
          # whether the file contained the phrase anywhere, so a migration that
          # created two tables and protected one passed — an unprotected table
          # could be smuggled in beside a protected one.
          fail=0
          for f in supabase/migrations/*.sql; do
            while read -r t; do
              [ -z "$t" ] && continue
              # (a) protected directly
              if grep -qEi "alter table (only )?public\.${t}\b[^;]*enable row level security" "$f"; then
                continue
              fi
              # (b) protected by a do-block that loops over a list of names
              if grep -q "enable row level security" "$f" && grep -qE "'${t}'" "$f"; then
                continue
              fi
              echo "::error file=$f::table '$t' is created but never has RLS enabled"
              fail=1
            done < <(grep -oE "create table (if not exists )?public\.[a-z_]+" "$f" \
                     | sed -E "s/.*public\.//")
          done
          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "every created table has RLS"

  migration-order:
    name: Migrations are append-only
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - name: Reject edits to already-applied migrations
        run: |
          set -euo pipefail
          changed=$(git diff --name-only --diff-filter=MD origin/${{ github.base_ref }}...HEAD \
                    -- supabase/migrations || true)
          if [ -n "$changed" ]; then
            echo "::error::Applied migrations were modified or deleted:"
            echo "$changed"
            echo "Migrations are append-only. Add a new file instead."
            exit 1
          fi
          echo "append-only respected"

  core-tests:
    name: Core logic tests
    # Linux, not macOS. AlbusCore is pure Swift with no UIKit — it is the whole
    # point of the package — so it needs no Apple toolchain, and a macOS runner
    # costs ten times a Linux one for an identical result.
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: swift test
        working-directory: ios/AlbusCore
        run: swift test

  ios-build:
    name: iOS build and tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: probe
        run: |
          if [ -f ios/project.yml ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No iOS project yet — skipping."
          fi
      - if: steps.probe.outputs.found == 'true'
        run: brew install xcodegen
      - if: steps.probe.outputs.found == 'true'
        working-directory: ios
        # Config.xcconfig holds the real Supabase values and is gitignored, so
        # CI has none. The placeholders build fine, and the UI tests that run
        # here are the ones that need no backend at all. The four that walk
        # real onboarding — each costing a production account and a real
        # Anthropic call — are skipped by name below.
        #
        # The project is generated rather than committed, so regenerating here
        # also catches a spec that no longer produces a valid project.
        run: |
          cp App/Config.example.xcconfig App/Config.xcconfig
          xcodegen generate --spec project.yml
      - if: steps.probe.outputs.found == 'true'
        working-directory: ios
        # The runner's Xcode decides which simulators exist, and it lags behind
        # local. Hardcoding a device name means CI breaks whenever either side
        # moves, so resolve one at run time instead. Plain shell on purpose:
        # embedded multi-line scripts break out of the YAML block scalar.
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available | grep -m1 "iPhone" | sed -E "s/.*\(([0-9A-F-]{36})\).*/\1/")
          if [ -z "$UDID" ]; then echo "::error::no iPhone simulator on this runner"; exit 1; fi
          echo "using simulator $UDID"
          # Skipped by class, not by whole target. These four walk real
          # onboarding, which creates an account on the production project and
          # spends a real Claude call. The rest launch already signed in with
          # the plan forced, so they cost nothing and belong in every run.
          #
          # The retry is for the simulator, not for the app: a UI test on a
          # shared runner can fail with "Timed out while launching
          # application", which says nothing about the code. A test that is
          # genuinely broken fails both attempts and still turns the run red.
          xcodebuild test -onlyUsePackageVersionsFromResolvedFile -project Albus.xcodeproj -scheme Albus -destination "id=$UDID" \
            -skip-testing:AlbusUITests/GraderUITests \
            -skip-testing:AlbusUITests/CoreLoopUITests \
            -skip-testing:AlbusUITests/PopupChromeUITests \
            -skip-testing:AlbusUITests/SettingsUITests \
            -retry-tests-on-failure -test-iterations 2 \
            -derivedDataPath "$RUNNER_TEMP/albus-build"
          python3 ../scripts/verify-app-privacy.py "$RUNNER_TEMP/albus-build/Build/Products/Debug-iphonesimulator/Albus.app"

  backend-tests:
    name: Edge function tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with: { deno-version: v2.9.5 }
      - name: Type-check, lint and test the edge functions
        working-directory: supabase/functions
        # These tests never ran in CI before, so a regression in prompt
        # building, model routing or plan validation could merge unnoticed.
        run: |
          deno task check
          deno task lint
          deno task test
