name: Database security

# Database containers are useful but not free. Run this only when the database
# security surface changes; an iOS-only pull request gets no value from pulling
# Postgres images again.
on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - 'supabase/functions/delete-account/**'
      - 'supabase/functions/_shared/**'
      - 'scripts/security/delete-account-boundary.py'
      - 'supabase/config.toml'
      - 'scripts/security-concurrency-local.sh'
      - 'scripts/security/financial-concurrency.py'
      - '.github/workflows/database-security.yml'

permissions:
  contents: read

jobs:
  adversarial-database:
    name: RLS, quota and concurrency attacks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1
        with:
          version: 2.98.2
      - name: Rebuild every migration
        run: supabase start
      - name: Rebuild the schema from migrations alone
        run: supabase db reset --local --no-seed --yes
      - name: Run policy and financial-safety assertions
        run: supabase test db --local
      - name: Race the last available slots
        run: scripts/security-concurrency-local.sh
      - name: Race payment events, processors and account cleanup
        run: python3 scripts/security/financial-concurrency.py
      - name: Only a student's own token deletes their account
        run: python3 scripts/security/delete-account-boundary.py
      - name: Stop local services
        if: always()
        run: supabase stop --no-backup
