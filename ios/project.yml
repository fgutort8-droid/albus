# Xcode project definition.
#
# Generated with `xcodegen generate` rather than committed as a .pbxproj:
# that file is machine-written, merges badly, and hides real changes in noise.
# This is the source of truth — regenerate after editing.
#
# Signing: the Apple Team ID lives in ios/App/Config.xcconfig, which is
# gitignored — this repo is public, and the team identifies a real developer
# account. Copy Config.example.xcconfig and fill in DEVELOPMENT_TEAM to build
# for a device. Without it the app still builds and tests in the simulator.
name: Albus
options:
  bundleIdPrefix: com.felipegutierrez
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

packages:
  AlbusCore:
    path: AlbusCore
  # Official client. Chosen over hand-rolled URLSession calls because the auth
  # token lifecycle — refresh, expiry margins, concurrent refresh — is
  # security-critical and easy to get subtly wrong.
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    from: 2.55.1

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic
    # Read from Config.xcconfig, which is gitignored. Empty in a fresh clone,
    # which means unsigned — fine for the simulator, and the only thing that
    # needs a real value is a device build or an upload.
    DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
    #
    # App/Albus/Albus.entitlements declares the Keychain access group the auth
    # session needs. An earlier attempt at ad-hoc signing (no team) was tried
    # and rejected: it produced an application-identifier the simulator
    # container did not match, and SwiftData then failed with "Sandbox access
    # to file-write-create denied" — a working app traded for an unverifiable
    # entitlement. A real team avoids that failure mode.
    #
    # Whether the simulator now also persists the session with a real team
    # set has not been re-verified since this changed on 2 Sep 2026 — check
    # empirically before relying on it either way. Quota enforcement does not
    # depend on this regardless — see the global spend fuse in migration
    # 0013, which bounds abuse no matter how many accounts exist.

targets:
  Albus:
    type: application
    platform: iOS
    sources:
      - path: App/Albus
    dependencies:
      - package: AlbusCore
      - package: Supabase
        product: Supabase
    configFiles:
      Debug: App/Config.xcconfig
      Release: App/Config.xcconfig
    info:
      path: App/Albus/Info.plist
      properties:
        CFBundleDisplayName: Albus
        # Transport uses system TLS; authentication uses system security APIs.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        SUPABASE_URL: $(SUPABASE_URL)
        SUPABASE_PUBLISHABLE_KEY: $(SUPABASE_PUBLISHABLE_KEY)
        # Empty until a Turnstile widget exists; empty means no challenge.
        TURNSTILE_SITE_KEY: $(TURNSTILE_SITE_KEY)
        TURNSTILE_ORIGIN: $(TURNSTILE_ORIGIN)
        ALBUS_SIGNED_BUILD: $(ALBUS_SIGNED_BUILD)
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # The app talks only to Supabase over HTTPS; no cleartext exceptions.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.felipegutierrez.albus
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleDarkContent
        # Set per-SDK: the project-level value loses to Xcode's iOS default
        # ("iPhone Developer"), which needs a team we deliberately do not have.
        # Ad-hoc is enough for the simulator and carries the entitlement.
        # Applied automatically once DEVELOPMENT_TEAM is set; see ios/README.md.
        CODE_SIGN_ENTITLEMENTS: App/Albus/Albus.entitlements

  AlbusTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: App/AlbusTests
    dependencies:
      - target: Albus
      - package: AlbusCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  AlbusUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: App/AlbusUITests
    dependencies:
      - target: Albus
    # The local-only onboarding proof reads this from its test bundle. The
    # value stays empty unless a deliberate xcodebuild invocation supplies it.
    info:
      path: App/AlbusUITests/Info.plist
      properties:
        ALBUS_LOCAL_CONTEXT_TEST: $(ALBUS_LOCAL_CONTEXT_TEST)

schemes:
  Albus:
    build:
      targets:
        Albus: all
        AlbusTests: [test]
        AlbusUITests: [test]
    test:
      targets:
        - AlbusTests
        # AlbusUITests makes a REAL backend call and costs money, so CI passes
        # -skip-testing:AlbusUITests. Run it deliberately:
        #   xcodebuild test -scheme Albus -only-testing:AlbusUITests
        - AlbusUITests
    run:
      config: Debug
